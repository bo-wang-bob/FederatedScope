# GGEUR (CNN): ConvNeXt-Base (pretrained, frozen) + MLP + FedAvg (With GGEUR data generation)
#
# Purpose: Run GGEUR with data generation under FedAvg aggregation (CNN branch).

use_gpu: True
device: 1
seed: 42
verbose: 1
log_file: t3_officehome_cnn_formal_platform.log

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 3
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True

  # Feature extractor (CNN)
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: False
  cnn_checkpoint_path: 'pretrained_models/convnext_base-6075fbad.pth'
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: True
  feature_cache_dir: 'exp/distributed_feature_cache/officehome_cnn'
  require_complete_feature_cache: True
  reuse_augmented_feature_cache: True
  save_augmented_feature_cache: True
  augmented_feature_cache_dir: 'exp/t2t6_4090_platform_cache/t3_officehome_cnn'

  # Enable GGEUR augmentation (stronger, but kept memory-safe)
  # Prefer prototype-based generation to avoid per-sample explosion under skew.
  num_generated_per_sample: 50
  num_generated_per_prototype: 50
  target_size_per_class: 20

  # MLP
  # Slightly stronger classifier to leverage augmented data
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off
  use_fedproto: False

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'officehome_lds/cnn/ggeur/fedavg'
