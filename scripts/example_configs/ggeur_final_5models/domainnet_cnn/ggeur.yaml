use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'domainnet'
  root: '/root/autodl-tmp/datasets/DomainNet'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 345

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.00001

ggeur:
  use: True

  domainnet_shared_classes_only: False
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''
  num_generated_per_sample: 1
  num_generated_per_prototype: 1
  target_size_per_class: 1
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0
  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  max_cross_client_prototypes_per_class: 12
  diagonal_covariance: True
  domain_personalized_head_epochs: 30
  domain_personalized_head_lr: 0.01
  domain_personalized_head_use_full_train_cache: True

outdir: 'exp/domainnet_4domains/cnn/ggeur_fedavg'
expname: 'domainnet_4domains_cnn_ggeur_fedavg'
