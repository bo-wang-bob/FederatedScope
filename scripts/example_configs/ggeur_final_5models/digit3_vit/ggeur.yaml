# Three-domain digit platform method: frozen CLIP ViT-B/16 + generated features.

use_gpu: true
device: 0
seed: 42
verbose: 1
log_file: t2_digit3_vit_formal_platform.log

federate:
  method: ggeur
  mode: standalone
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: digits-3domain
  root: data/digit_three_domain
  splits: [1.0, 0.0, 0.0]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: ggeur_mlp
  num_classes: 10

train:
  local_update_steps: 5
  optimizer:
    type: Adam
    lr: 0.0001

ggeur:
  use: true
  feature_extractor: clip
  clip_model: ViT-B-16
  clip_pretrained: openai
  clip_model_path: ''
  embedding_dim: 512
  feature_cache_dir: exp/distributed_feature_cache/digit3_vit
  use_feature_cache: true
  require_complete_feature_cache: true
  reuse_augmented_feature_cache: true
  save_augmented_feature_cache: true
  augmented_feature_cache_dir: exp/t2t6_4090_platform_cache/t2_digit3_vit
  extract_batch_size: 64

  num_generated_per_sample: 10
  num_generated_per_prototype: 20
  target_size_per_class: 40
  use_cross_client_prototypes: true
  max_cross_client_prototypes_per_class: 12
  statistics_round: 0

  use_lds: true
  lds_alpha: 0.1
  lds_seed: 42
  digit3_manifest_path: ''
  digit3_manifest_base: data/digit_three_domain/manifests
  digit3_manifest_use_config_root: true
  digit3_global_manifest_path: data/digit_three_domain/dataset_manifest.json
  digit3_domains: [emnist_digits, usps, svhn]

  task_adaptation_file: ''
  task_class_counts: []
  task_default_target_size: ''
  training_distribution_dir: 'exp/digit_three_domain/training_distributions'

  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_fedproto: false
  use_cnn_distillation: false
  use_feature_alignment: false
  use_separated_training: false

outdir: exp/digit_three_domain
expname: vit/ours
