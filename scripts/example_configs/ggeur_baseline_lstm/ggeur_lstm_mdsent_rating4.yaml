# GGEUR on Multi-Domain Sentiment (Blitzer et al., 2007) using rating (4-class)
#
# Dataset: https://www.cs.jhu.edu/~mdredze/datasets/sentiment/index2.html
# Pretrained BERT: https://huggingface.co/nlptown/bert-base-multilingual-uncased-sentiment
#
# - Domains: books / dvd / electronics / kitchen (data/sentiment/*)
# - Labels: rating {1.0, 2.0, 4.0, 5.0} -> 4 classes
# - Feature extractor (frozen): pretrained BERT
# - Trainable model: LSTM classifier (NOT pretrained)

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 120
  total_round_num: 200
  sample_client_num: 120

data:
  type: 'mdsent'
  root: 'data/sentiment'
  splits: [0.8, 0, 0.2]
  dirichlet_alpha: 0.01
  args:
    - include_unlabeled: True
      balance_test: True
      seed: 42
      use_cache: True

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_lstm'
  num_classes: 4
  in_channels: 768
  hidden: 256
  layer: 1
  dropout: 0.1

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.1

ggeur:
  use: True
  feature_extractor: 'bert'
  bert_model_path: 'pretrained_models/nlptown_bert_base_multilingual_uncased_senti'
  bert_tokenizer_path: ''
  bert_max_length: 128
  bert_pooling: 'cls'
  bert_batch_size: 32
  bert_local_files_only: True
  bert_use_pretrained_weights: True
  embedding_dim: 768
  use_feature_cache: True
  feature_cache_dir: ''
  num_generated_per_sample: 200
  num_generated_per_prototype: 200
  target_size_per_class: 200
  use_cross_client_prototypes: True
  statistics_round: 0
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_fedproto: False

outdir: 'exp/ggeur_lstm_sentiment'
expname: 'ggeur_mdsent_rating4_lstm'
