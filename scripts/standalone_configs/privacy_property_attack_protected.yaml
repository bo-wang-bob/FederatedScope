# True GGEUR + Meta-PPA example for FederatedScope-feature-GGEUR
#
# This version runs the real GGEUR training path (`federate.method: ggeur`)
# and uses the modular GGEUR attack hook to evaluate property inference
# on the GGEUR MLP classifier head.

use_gpu: True
device: 0
seed: 12345
verbose: 1

security:
  mode: privacy
  standalone_only: True

early_stop:
  patience: 0

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  sample_client_num: 60
  total_round_num: 100
  make_global_eval: False

data:
  type: 'office-home'
  root: '/root/autodl-tmp/zqq/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 8
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  batch_or_epoch: epoch
  optimizer:
    type: Adam
    lr: 0.001
    weight_decay: 0.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: ggeur

eval:
  freq: 5
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: test_acc

attack:
  attack_method: ggeur_ppa

  # Disk-backed modular attack hook for the GGEUR MLP head.
  # Only property inference is enabled; no membership inference plugins run.
  use_ggeur: True
  modular_attacks: True
  attack_plugins:
      - meta_ppa

  # Save selected GGEUR MLP states for property inference.
  meta_ppa_save_interval: 10

  # Meta-PPA: infer each client's dominant local class from MLP sensitivity.
  classifier_PIA: svm
  meta_ppa_probe_samples_per_class: 16
  meta_ppa_probe_epochs: 3
  meta_ppa_probe_lr: 0.001
  meta_ppa_probe_batch_size: 16
  meta_ppa_max_attack_rounds: 10
  meta_ppa_max_clients: 0
  meta_ppa_target_layers: []

# Real GGEUR settings
# - use CLIP/CNN feature extraction on Office-Home images
# - round 0 statistics collection happens here
# - the client code now tolerates missing statistics_round via getattr,
#   but we still set it explicitly for clarity.
ggeur:
  use: True
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0
  mlp_hidden_dim: 0
  mlp_dropout: 0
  mlp_weight_decay: 0
  mlp_label_smoothing: 0
  mlp_l2_reg: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0
  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  cnn_model: 'convnext_base'
  cnn_lr: 0.01
  cnn_local_epochs: 1
  cnn_warmup_rounds: 0
  local_decoy:
    use: True
    train_with_decoy: True
    num_per_class: 60
    noise_scale: 0.4
    min_std: 0.0001
    max_total: 0
    seed_offset: 1701



dp:
  enabled: True 
  level: client_update
  mechanism: gaussian
  accountant: empirical
  epsilon: 3.0
  delta: 1.0e-5
  noise_multiplier: 0.2
  max_grad_norm: 1.0
  clip_percentile: 75.0
  param_level: True
  protect_ggeur_update: True
  private_clip_update: True
  upload_private_stats: False
  log_private_stats: True
  seed: 12345
  clipping:
    type: adaptive
    initial_clip: 7
    target_quantile: 0.7
    ema: 0.9
    min_clip: 7
    max_clip: 7
outdir: 'exp/attack/ppa/ggeur_meta_ppa_officehome_defense'
expname: 'ggeur_meta_ppa_officehome_60_ggeur'
