# Accuracy-parity reference for the three-machine OfficeHome + ViT GGEUR run.
# Keep training/data parameters aligned with officehome_vit_ggeur and change
# only execution topology, paths and output location.

use_gpu: true
device: 1
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: true
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  clip_model_path: '/root/.cache/clip/ViT-B-16.pt'
  embedding_dim: 512
  num_generated_per_sample: 50
  num_generated_per_prototype: 50
  target_size_per_class: 50
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: true
  statistics_round: 0
  use_fedproto: false
  use_lds: true
  lds_alpha: 0.1
  lds_seed: 42
  use_cnn_distillation: false
  use_feature_alignment: false
  use_separated_training: false
  feature_cache_dir: '/root/autodl-tmp/FederatedScope/exp/distributed_feature_cache/officehome_vit'
  require_complete_feature_cache: true
  officehome_manifest_base: '/root/autodl-tmp/FederatedScope/exp/distributed_manifests/officehome_60c_lds01_seed42'
  officehome_manifest_use_config_root: true
  augmented_feature_cache_dir: '/root/autodl-tmp/FederatedScope/exp/standalone_reference/officehome_vit_ggeur/augmented_feature_cache'
  hierarchical_training: false

outdir: '/root/autodl-tmp/FederatedScope/exp/standalone_reference/officehome_vit_ggeur'
expname: 'officehome_vit_ggeur_standalone_reference'

trainer:
  type: 'ggeur'
