# GGEUR + CLIP (ViT-B-16) + A3FL (常见后门)
#
# Small runnable test config derived from `vit_newdataset.yaml`.
# 本模板 = 平台「常见后门」攻击对应的实验配置。
# A3FL 设置对齐参考实现里 ViT + GGEUR 的那份配置
# (ggeur_baseline_vit/officehome_lds_vit_ggeur_fedavg_a3fl_flame.yaml),
# 只把触发器搜索预算压到与 sabre 模板同一量级, 保证能跑完。

use_gpu: True
device: 0
seed: 42
verbose: 1

aggregator:
  robust_rule: ''
  byzantine_node_num: 0
  BFT_args: {}

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 15
  total_round_num: 100
  sample_client_num: 15
  master_port: 29501

data:
  # 模拟"用户上传自己的数据集": 这份数据没有 <域>/<类>/ 的 DomainNet 层级,
  # 而是已经划分好的 train/ 与 test/ 两份。平台和运行时走同一条通道 --
  # domainnet + 便携 manifest(带显式 split), DomainNet 见到 split 字段后
  # 会跳过随机切分, 直接按 manifest 的划分取数据。
  #   manifest 由 scripts/backdoor/build_uploaded_manifest.py 生成
  type: 'domainnet'
  root: 'C:\Users\pc\Desktop\logs\FederatedScope\dataset'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 16
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 20

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.0001

eval:
  freq: 1

attack:
  attack_method: 'a3fl'
  attacker_id: [1, 2, 3]
  inject_round: 0
  target_label_ind: 0
  poison_ratio: 0.3
  scale_poisoning: False
  aggregate_benign_only: false
  scale_para: 1.0
  a3fl:
    # Start after the clean classifier has formed a boundary.
    start_round: 40
    # Keep attack active through round 80 of this 100-round run.
    poison_epochs: 41

    # Trigger (12x12 patch at offset 2) optimised on the CLIP feature space.
    sample_method: random
    sample_poison_ratio: 1.0
    save_trigger_samples: False
    save_trigger_max_samples: 4
    trigger_size: 12
    trigger_offset: 2
    trigger_init: 0.5
    trigger_lr: 0.01
    trigger_clip_min: -2.0
    trigger_clip_max: 2.0
    # 自适应触发器搜索预算 (参考实现为 20x10, 这里压到可跑完的量级)。
    trigger_outer_epochs: 10
    trigger_search_batches: 2
    # 每 10 个攻击轮重优化一次触发器, 其余轮复用。
    trigger_update_interval: 10

    # Poisoned head optimisation + update strengthening.
    poison_feature_repeat: 2
    poison_train_epochs: 5
    poison_train_lr: 1.0e-3
    update_scale: 1.0
    target_row_scale: 2.0

adaptive_dp:
  # 必须关闭: cfg_security 规定 backdoor 模式下不能启用隐私保护。
  use: false
  initial_clip: 0.8
  target_quantile: 0.7
  ema: 0.9
  min_clip: 0.05
  max_clip: 10.0
  noise_multiplier: 0.01
  seed: 0

ggeur:
  use: True

  # Feature extractor (ViT)
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  clip_model_path: 'C:\Users\pc\sf\FL\open_clip_vitb16.bin'
  embedding_dim: 512


  use_feature_cache: True
  feature_cache_dir: 'C:\Users\pc\Desktop\logs\FederatedScope\exp\defense_tests\feature_cache'
  head_only_mode: True
  headonly_skip_round0_if_augmented_cache_exists: True

  # 单一域名 'uploaded' 表示"用户上传", 与平台的上传数据集完全一致。
  domainnet_domains: ['uploaded']
  domainnet_manifest_path: 'C:\Users\pc\Desktop\logs\FederatedScope\dataset\manifest.json'
  domainnet_shared_classes_only: False

  # Smaller augmentation budget for quick smoke testing.
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # Linear head keeps the setup simple.
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  use_cross_client_prototypes: True
  statistics_round: 0

  #FLAME defense
  # defense_method: 'flame'
  # flame_lambda_noise: 0.001
  # flame_weighted_avg: False
  # defense_method: 'foolsgold'
  # foolsgold_debug: true
  # foolsgold_debug_max_clients: 20
  # defense_method: multi_krum
  # multi_krum_num_malicious: 2
  # multi_krum_debug: true
  # defense_method: trimmed_mean
  # trimmed_mean_trim_ratio: 0.25
  # trimmed_mean_debug: false
  # defense_method: align_ins
  # align_ins_debug: true
  # defense_method: multi_metrics
  # multi_metrics_adaptive_threshold: true 
  # multi_metrics_history_smoothing: true   
  # multi_metrics_keep_ratio: 0.75            
  # multi_metrics_z_threshold: 1.0
  # multi_metrics_ema_alpha: 0.6

  # FedProto off
  use_fedproto: False

  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_fedproto: False
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/defense_tests/a3fl'
expname: 'a3fl_vit_newdataset'
