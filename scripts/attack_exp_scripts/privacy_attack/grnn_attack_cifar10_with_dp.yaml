use_gpu: True
device: 0
early_stop:
  patience: 0
seed: 12345

federate:
  mode: standalone
  total_round_num: 1  # 只进行1轮训练用于攻击测试
  sample_client_num: 5
  client_num: 10

data:
  root: data/
  type: CIFAR10@torchvision
  args: [{'download': True}]
  splits: [0.8,0.2,0.2]
  subsample: 0.2
  transform: [['ToTensor'], ['Normalize', {'mean': [0.4914, 0.4822, 0.4465], 'std': [0.2470, 0.2435, 0.2616]}]]
  splitter: 'lda'
  splitter_args: [{'alpha': 0.2}]

dataloader:
  batch_size: 1  # GRNN 在 batch_size=1 时效果最好

model:
  type: convnet2
  hidden: 2048
  out_channels: 10
  dropout: 0

train:
  local_update_steps: 1
  optimizer:
    lr: 0.01
    weight_decay: 0.0

# ========== 差分隐私配置 ==========
# 启用差分隐私防御GRNN攻击
grad:
  grad_clip: 1.0  # 梯度裁剪阈值 C

nbafl:
  use: true       # 启用差分隐私
  mu: 0.01        # 学习率相关参数
  epsilon: 5.0    # 隐私预算 ε（测试不同值：10, 5, 1, 0.5）
  w_clip: 1.0     # 权重裁剪
  constant: 1     # 噪声缩放常数
# =================================

criterion:
  type: CrossEntropyLoss

trainer:
  type: cvtrainer

eval:
  freq: 10
  metrics: ['acc', 'correct']

# GRNN 攻击配置
attack:
  attack_method: GRNN
  max_ite: 5000
  reconstruct_lr: 0.0001
  reconstruct_optim: RMSprop

  # GRNN 特定参数
  grnn_g_in: 256
  grnn_tv_weight: 0.0001
  grnn_use_wd: True

outdir: exp/attack/grnn_cifar10_with_dp_eps5
