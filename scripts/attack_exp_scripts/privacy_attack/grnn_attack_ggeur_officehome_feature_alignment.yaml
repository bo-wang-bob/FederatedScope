# GRNN attack on GGEUR image branch: Office-Home + feature alignment
#
# This attacks the IMAGE branch of GGEUR, not the default feature-MLP branch.
# It is meaningful only when GGEUR actually trains on images, so we enable:
#   ggeur.use_feature_alignment = True
# and keep the rest of the GGEUR pipeline intact.

use_gpu: True
device: 0
seed: 42
verbose: 1

early_stop:
  patience: 0

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 4
  sample_client_num: 4
  total_round_num: 2

data:
  type: 'office-home'
  root: '/root/autodl-tmp/zqq/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 1
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  optimizer:
    type: SGD
    lr: 0.001

criterion:
  type: CrossEntropyLoss

eval:
  freq: 1
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: test_loss

attack:
  attack_method: GRNN
  max_ite: 500
  reconstruct_lr: 0.0002
  reconstruct_optim: RMSprop
  info_diff_type: l2
  alpha_TV: 0.001

  grnn_g_in: 512
  grnn_tv_weight: 0.0001
  grnn_use_wd: False

ggeur:
  use: True

  # Feature extractor (CNN)
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: False
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''

  # Disable GGEUR augmentation (baseline)
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # MLP
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off
  use_fedproto: False

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep distillation/separated modes off, but enable an offline
  # CE-only CNN image branch so GRNN has image gradients to reconstruct.
  use_cnn_distillation: False
  use_feature_alignment: True
  grnn_ce_only_image_branch: True
  use_separated_training: False

  # Image branch attacked by GRNN. This is separate from the ConvNeXt
  # feature extractor above.
  cnn_model: 'resnet18'
  align_weight: 0.0
  use_prototype_alignment: False
  prototype_align_weight: 0.0
  cnn_lr: 0.01
  cnn_local_epochs: 1
  cnn_warmup_rounds: 0

outdir: 'exp/attack/grnn_ggeur_officehome_feature_alignment'
expname: 'grnn_attack_ggeur_officehome_feature_alignment'
