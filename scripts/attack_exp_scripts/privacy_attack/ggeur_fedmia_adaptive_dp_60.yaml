# Complete GGEUR + FedMIA + Adaptive Client-Update DP config.
#
# Run:
#   cd /root/autodl-tmp/zqq/FederatedScope-feature-GGEUR-editable
#   python -m federatedscope.main \
#     --cfg scripts/attack_exp_scripts/privacy_attack/ggeur_fedmia_adaptive_dp_full.yaml
#
# Notes:
# - This uses adaptive clipping + Gaussian noise on uploaded client model_delta.
# - FedSMP is disabled; adaptive_dp is a separate defense.
# - This is an empirical/practical DP defense unless private clip update and
#   formal accounting are added.

use_gpu: True
device: 0
seed: 12345
verbose: 1

outdir: 'exp/attack/ggeur_fedmia_adaptive_dp_officehome'
expname: 'ggeur_fedmia_adaptive_dp_officehome'

early_stop:
  patience: 0

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  sample_client_num: 60
  total_round_num: 200
  make_global_eval: False

data:
  type: 'office-home'
  root: '/root/autodl-tmp/zqq/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 8
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65


train:
  local_update_steps: 1
  batch_or_epoch: epoch
  optimizer:
    type: Adam
    lr: 0.001
    weight_decay: 0.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: ggeur

eval:
  freq: 5
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: test_acc

attack:
  attack_method: ggeur_fedmia
  fedmia_target_client_id: 3
  fedmia_variant: 'FedMIA-I'

  # Moderate-strong FedMIA setting: multi-round + mix nonmembers + mean
  # aggregation. This avoids the extremely weak final-round-only setting while
  # keeping a variance floor to reduce pathological CDF saturation.
  mode: mix
  mix_length: 1000
  fedmia_save_interval: 50
  fedmia_store_grad_cos: True
  fedmia_i_round_agg: mean
  fedmia_shadow_stat_mode: indexed
  fedmia_var_floor: 0.02

  # GGEUR-aware disk-backed attack feature extraction.
  use_ggeur: True
  ggeur_num_per_sample: 50
  ggeur_target_size: 200
  ggeur_use_cross_client: True
  ggeur_normalize_fields: ['train_losses']

  modular_attacks: True
  attack_plugins:
    - fedmia_i
    - fedmia_ii

# Explicitly keep FedSMP off for this experiment. Adaptive DP below is the only
# upload defense.
fed_smp:
  use: False

# GGEUR settings for Office-Home CNN feature extraction + MLP head training.
ggeur:
  use: True
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''

  # No generated samples in this config; this keeps the experiment closer to
  # the current no-defense FedMIA baseline.
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0

  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  cnn_model: 'convnext_base'
  cnn_lr: 0.01
  cnn_local_epochs: 1
  cnn_warmup_rounds: 0

# Client-update DP applied to uploaded GGEUR model_delta.
# This keeps adaptive clipping, but exposes it through the standard dp: entry.
# Current accountant is empirical; strict formal DP still requires private clip
# update and an RDP/accountant implementation for all released statistics.
dp:
  enabled: True
  level: client_update
  mechanism: gaussian
  accountant: rdp
  epsilon: 4.0
  delta: 1e-5
  # 0.0 means derive sigma from epsilon/delta/rounds/client sampling rate.
  noise_multiplier: 0.0
  protect_ggeur_update: True
  private_clip_update: False
  upload_private_stats: False
  log_private_stats: True
  seed: 12345
  clipping:
    type: adaptive
    initial_clip: 0.5
    target_quantile: 0.7
    ema: 0.9
    min_clip: 0.02
    max_clip: 5

# Legacy entry kept disabled. New experiments should use dp: above.
adaptive_dp:
  use: False
