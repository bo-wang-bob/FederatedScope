use_gpu: True
device: 0
early_stop:
  patience: 0
seed: 12345

federate:
  mode: standalone
  total_round_num: 1
  client_num: 8

data:
  type: 'office-home'
  root: '/root/autodl-tmp/zqq/OfficeHomeDataset_10072016'  # 绝对路径
  splits: [0.7, 0.0, 0.3]  # train:70%, val:0%, test:30%


dataloader:
  batch_size: 1
    # GRNN 在 batch_size=1 时效果最好

model:
  type: convnet2  # 或使用 resnet18
  hidden: 512
  out_channels: 65  # OfficeHome 有 65 个类别
  dropout: 0

train:
  local_update_steps: 1
  optimizer:
    lr: 0.01
    weight_decay: 0.0

# Differential privacy defense for the GRNN comparison.
grad:
  grad_clip: 1.0

nbafl:
  use: true
  mu: 0.01
  epsilon: 5.0
  w_clip: 1.0
  constant: 1.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: cvtrainer

eval:
  freq: 10
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: test_loss  # 改为 test_loss，因为没有 val 数据

# GRNN 攻击配置
attack:
  attack_method: GRNN
  max_ite: 500  # 大幅增加迭代次数以充分优化（3000→10000）
  reconstruct_lr: 0.0002     # 增大学习率加快收敛（0.00005→0.0001）
  reconstruct_optim: RMSprop

  # GRNN 特定参数
  grnn_g_in: 512             # 高分辨率需要更大的生成器
  grnn_tv_weight: 0.0001     # TV 正则化对自然图像有效
  grnn_use_wd: False          # 启用 Wasserstein 距离
  grnn_psnr_threshold: 0.9

outdir: exp/attack/grnn_officehome_defense_results
