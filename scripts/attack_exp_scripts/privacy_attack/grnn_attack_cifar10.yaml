use_gpu: True
device: 0
early_stop:
  patience: 0
seed: 12345

federate:
  mode: standalone
  total_round_num: 1
  sample_client_num: 5
  client_num: 10

data:
  root: data/
  type: CIFAR10@torchvision
  args: [{'download': True}]
  splits: [0.8,0.2,0.2]
  subsample: 0.2
  transform: [['ToTensor'], ['Normalize', {'mean': [0.4914, 0.4822, 0.4465], 'std': [0.2470, 0.2435, 0.2616]}]]
  splitter: 'lda'
  splitter_args: [{'alpha': 0.5}]

dataloader:
  batch_size: 4  # GRNN 在 batch_size=1 时效果最好

model:
  type: resnet18_grnn
  hidden: 2048
  in_channels: 3
  out_channels: 10
  dropout: 0

train:
  local_update_steps: 1
  optimizer:
    lr: 0.01
    weight_decay: 0.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: cvtrainer

eval:
  freq: 10
  metrics: ['acc', 'correct']

# GRNN 攻击配置（优化版本）
attack:
  attack_method: GRNN
  max_ite: 500              # 使用更长优化过程接近原论文设定
  reconstruct_lr: 0.00005    # CIFAR-10 上更稳，减少震荡
  reconstruct_optim: RMSprop # GRNN 使用 RMSprop 优化器

  # GRNN 特定参数（已优化）
  grnn_g_in: 128            # 小图像使用较小潜变量更稳定
  grnn_tv_weight: 0.000001  # 接近原论文 res18 的 TV 权重
  grnn_use_wd: True          # 保持原论文中的梯度 Wasserstein 项

outdir: exp/attack/grnn_cifar10
