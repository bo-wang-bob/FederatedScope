# True GGEUR + FedMIA example for FederatedScope-feature-GGEUR
#
# This version runs the real GGEUR training path (`federate.method: ggeur`)
# and uses the GGEUR-native FedMIA server to evaluate loss- and cosine-based
# membership inference on the GGEUR MLP classifier head.

use_gpu: True
device: 0
seed: 12345
verbose: 1

early_stop:
  patience: 0

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 4
  sample_client_num: 4
  total_round_num: 50
  make_global_eval: False

data:
  type: 'office-home'
  root: '/root/autodl-tmp/zqq/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 8
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  batch_or_epoch: epoch
  optimizer:
    type: Adam
    lr: 0.001
    weight_decay: 0.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: ggeur

eval:
  freq: 5
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: test_acc

attack:
  attack_method: ggeur_fedmia
  fedmia_target_client_id: 3
  fedmia_variant: 'FedMIA-I'
  # Moderate-strong attacker setting for no-defense ablation: use
  # index-wise shadow calibration with a variance floor, plus mix samples
  # and multi-round aggregation, so FedMIA-I is not artificially too weak.
  mode: mix
  mix_length: 1000
  fedmia_save_interval: 5
  fedmia_store_grad_cos: True
  fedmia_i_round_agg: mean
  fedmia_shadow_stat_mode: global
  fedmia_var_floor: 0.02
  fedmia_use_augmented_nonmember: True
  fedmia_augmented_nonmember_size: 0
  fedmia_use_image_aug_member: True
  fedmia_image_aug_member_size: 0
  # Strong disk-backed feature-space FedMIA attacks for the GGEUR MLP head.
  # Current GGEUR feature artifacts provide loss/logit/label/cos/grad_diff/grad_norm features.
  use_ggeur: True
  ggeur_num_per_sample: 0
  ggeur_target_size: 0
  ggeur_use_cross_client: True
  ggeur_normalize_fields: ['train_losses']
  modular_attacks: True
  # Report only the limited FedMIA attacks in this ablation.
  attack_plugins:
    - fedmia_i
    - fedmia_ii

# Real GGEUR settings
# - use CLIP/CNN feature extraction on Office-Home images
# - round 0 statistics collection happens here
# - the client code now tolerates missing statistics_round via getattr,
#   but we still set it explicitly for clarity.
ggeur:
  use: True
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  mlp_weight_decay: 0.0
  mlp_label_smoothing: 0.0
  mlp_l2_reg: 0.0
  mixup:
    use: True
    alpha: 0.4
    prob: 1.0
  image_aug_defense:
    use: True
    num_views: 2
    rotation_degrees: 15.0
    translate: 0.1
    shear_degrees: 10.0
    color_jitter: 0.2
    horizontal_flip_prob: 0.5
  use_cross_client_prototypes: True
  statistics_round: 0
  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  cnn_model: 'convnext_base'
  cnn_lr: 0.01
  cnn_local_epochs: 1
  cnn_warmup_rounds: 0
  local_decoy:
    use: True
    train_with_decoy: True
    num_per_class: 10
    noise_scale: 0.10
    min_std: 0.0001
    max_total: 0
    seed_offset: 1701

outdir: 'exp/attack/ggeur_fedmia_officehome'
expname: 'ggeur_fedmia_officehome_4_aug'
